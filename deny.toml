# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI's audit.yml runs `cargo deny check advisories` (the RustSec database)
# when dependencies change and once a week. Only that check is configured.

[advisories]
# Unmaintained crates count only when a workspace crate depends on them
# directly. The transitive ones today have no known vulnerability: paste
# (via tokenizers) and unsafe-libyaml (via serde_yaml, which is itself
# deprecated upstream: replacing it is the way to clear this one).
unmaintained = "workspace"

# Reasoned exceptions: each says why it is safe for now and what clears it.
ignore = [
    # chrono and chrono-tz are marked unmaintained (2026-11): no known
    # vulnerability, and no maintained release to move to. Dates, time
    # zones and calendar recurrence use them throughout; moving to jiff is
    # planned as its own change, which removes these two entries.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known vulnerability; move to jiff planned" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no known vulnerability; move to jiff planned" },
]
